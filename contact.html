    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Font -->

<body>

    <nav class="navbar pasada-nav">
        <div class="container-fluid pasada-theme py-3 px-12">   
            <a 
                href="index.html" 
                class="d-inline-flex align-items-center pasada-nav">
                    <img src="logo.png" alt="PASADA Logo" class="rounded-circle mx-3" width="60" height="60">
                    <span class="fs-3xl fw-bold px-3">PASADA</span> 
            </a>   
        </div>  
    </nav>

    <main class="py-12">

        <div class="container px-12">
            <h1 class="pasada-body text-center py-7 fw-bold">Contact</h1>
        </div>

        <div class="container">
            <div class="row">
              <div class="md:col-6 pasada-body">
                <form id="contact-form">
                    
                    <div class="py-3">
                        <label for="customer-name" class="fs-xl fw-semibold pasada-body py-3">Name</label>
                        <input type="text" class="form-control p-2" id="customer-name">
                    </div>

                    <div class="py-3">
                      <label for="customer-email" class="fs-xl fw-semibold pasada-body py-3">Email address</label>
                      <input type="email" class="form-control" id="customer-email">
                    </div>

                    <div class="py-3 mt-7">
                        <label for="customer-inquiry" class="fs-xl pasada-body fw-semibold py-3">Message</label>
                        <textarea class="form-control" id="customer-inquiry" rows="6"></textarea>

                    </div>


                    <button type="submit" class="btn-solid pasada-nav fs-xl px-7 py-3 mt-7">Submit</button>

                  </form>
              </div>
              <div class="md:col-6 pasada-body">
                <img src="logo-contact.png" class="rounded mx-auto d-block" alt="PASADA Logo">
              </div>
            </div>
        </div>

    </main>

        <nav class="navbar sm:navbar-expand pasada-nav">

                  <ul class="navbar-nav">
                    <li class="nav-item">
                      <a class="pasada-nav nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                      <a class="pasada-nav nav-link" href="about.html">About</a>
