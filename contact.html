<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us | PASADA</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body class="d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <div id="site-header"></div>


    <!-- MAIN CONTENT -->
    <main class="flex-grow-1 d-flex align-items-center py-5">

        <!-- Contact Information Section -->
        <section class="contact-section container">

            <div class="row align-items-center justify-content-center g-4 g-lg-5 contact-container">

                <!-- Left: PASADA Logo -->
                <div class="col-12 col-md-5 col-lg-4 text-center logo-contact">
                    <img src="images/logo-contact.png" alt="PASADA Logo" class="img-fluid" style="max-width: 240px;">
                </div>

                <!-- Right: Contact Details -->
                <div class="col-12 col-md-7 col-lg-6 text-center text-md-end contact-info">

                    <h1 class="fw-bold display-5 mb-4">Contact Us</h1>

                    <p class="font-monospace fs-4 mb-4">912-3456-789 / +(02) 888 8888</p>

                    <p class="font-monospace fs-4 mb-4">hello@simpletees.example.</p>

                    <p class="font-monospace fs-4 mb-0">Quezon City, Philippines</p>

                </div>

            </div>

            <!-- Social Media Links -->
            <div class="d-flex justify-content-center align-items-center gap-3 mt-5 pt-3 fs-1 social-media">

                <a href="#" aria-label="Instagram" class="text-decoration-none" style="color: #2675f5;">
                    <i class="bi bi-instagram"></i>
                </a>

                <a href="#" aria-label="Facebook" class="text-decoration-none" style="color: #2675f5;">
                    <i class="bi bi-facebook"></i>
                </a>

                <a href="#" aria-label="X" class="text-decoration-none" style="color: #2675f5;">
                    <i class="bi bi-twitter-x"></i>
                </a>

                <a href="#" aria-label="LinkedIn" class="text-decoration-none" style="color: #2675f5;">
                    <i class="bi bi-linkedin"></i>
                </a>

                <a href="#" aria-label="WhatsApp" class="text-decoration-none" style="color: #2675f5;">
                    <i class="bi bi-whatsapp"></i>
                </a>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <div id="site-footer" data-include="footer.html"></div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Shared Components JavaScript -->
    <script src="js/components.js"></script>

    <!-- Load footer.html -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('site-footer').innerHTML = data;
            });
    </script>

</body>
</html>
